apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: online-hpa
  namespace: online-ns
  labels:
    name: online-hpa
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: online-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70